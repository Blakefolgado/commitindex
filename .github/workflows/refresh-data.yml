name: Refresh company data

on:
  schedule:
    # A third of the companies at a time. The built-in Actions token allows
    # 1,000 GitHub requests an hour and a full sweep of 168 companies needs
    # roughly double that, so the list is refreshed in three passes spread
    # across the day. Every company still gets refreshed daily.
    - cron: "20 2 * * *"
    - cron: "20 10 * * *"
    - cron: "20 18 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Slice to refresh, as i/n (blank refreshes only missing companies)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generators read through the app's internal ingest endpoints, so the
      # app has to be running. Built and started rather than dev for speed.
      - name: Start the app
        env:
          GITHUB_TOKEN: ${{ secrets.COMMIT_INDEX_GITHUB_TOKEN || github.token }}
          COMMIT_INDEX_INGEST_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pnpm exec next build
          pnpm exec next start -p 3000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done

      - name: Pick the slice for this run
        id: slice
        run: |
          case "${{ github.event.schedule }}" in
            "20 2 * * *")  echo "shard=0/3" >> "$GITHUB_OUTPUT" ;;
            "20 10 * * *") echo "shard=1/3" >> "$GITHUB_OUTPUT" ;;
            "20 18 * * *") echo "shard=2/3" >> "$GITHUB_OUTPUT" ;;
            *)             echo "shard=${{ github.event.inputs.shard }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Refresh snapshots
        env:
          COMMIT_INDEX_INCREMENTAL: "1"
          COMMIT_INDEX_SHARD: ${{ steps.slice.outputs.shard }}
          COMMIT_INDEX_INGEST_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/generate-leaderboard.mjs
          node scripts/generate-organizations.mjs

      - name: Commit any changes
        run: |
          git config user.name "commitindex-bot"
          git config user.email "noreply@commitindex.com"
          git add data/leaderboard.json data/organizations.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "data: daily refresh"
          git push
